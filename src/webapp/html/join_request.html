<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; color: #f8fafc; font: 16px "Segoe UI", Roboto, Arial, sans-serif; background: linear-gradient(135deg, #060b14, #0b1220 48%, #17111f); }
    main { width: min(100%, 380px); padding: 34px 24px 28px; text-align: center; border: 1px solid #ffffff29; border-radius: 12px; background: #080e1cad; box-shadow: 0 26px 70px #00000061; backdrop-filter: blur(18px); }
    main::before { content: ""; display: block; width: 54px; height: 5px; margin: 0 auto 22px; border-radius: 999px; background: linear-gradient(90deg, #22d3ee, #818cf8, #f59e0b); }
    h1 { margin: 0 0 22px; font-size: 29px; line-height: 1.2; overflow-wrap: anywhere; }
    button { width: 100%; min-height: 52px; border: 0; border-radius: 14px; color: #fff; background: linear-gradient(135deg, #0ea5e9, #14b8a6 48%, #f59e0b 128%); font-size: 16px; font-weight: 750; cursor: pointer; }
    button:disabled { background: #526073; cursor: not-allowed; }
    .status { min-height: 22px; margin-top: 18px; color: #5eead4; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <h1 id="welcomeTitle">Добро пожаловать</h1>
    <button id="loginButton" type="button">Войти</button>
    <div class="status" id="statusMessage" aria-live="polite"></div>
  </main>
  <script>
    const webApp = window.Telegram?.WebApp;
    const button = document.getElementById("loginButton");
    const status = document.getElementById("statusMessage");
    const title = document.getElementById("welcomeTitle");
    const params = new URLSearchParams(location.search);
    const queryId = params.get("query_id") || "";
    const chatTitle = params.get("title") || "";
    if (chatTitle) title.textContent = `Добро пожаловать в чат "${chatTitle}"!`;
    webApp?.ready();
    button.addEventListener("click", async () => {
      button.disabled = true;
      try {
        const response = await fetch("/answer_join_request", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ _auth: webApp?.initData || "", query_id: queryId }) });
        if (!response.ok) throw new Error("Request failed");
        let seconds = 3;
        status.textContent = `Успешно! Страница закроется через ${seconds} секунд`;
        const timer = setInterval(() => { if (--seconds > 0) status.textContent = `Успешно! Страница закроется через ${seconds} секунд`; else { clearInterval(timer); webApp?.close(); window.close(); } }, 1000);
      } catch (error) { console.error(error); status.textContent = "Не удалось подтвердить заявку"; button.disabled = false; }
    });
  </script>
</body>
</html>
