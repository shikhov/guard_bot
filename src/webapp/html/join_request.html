<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --text-color: #111827;
            --button-shadow: rgba(37, 99, 235, 0.34);
            --button-disabled: #a3aab8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            background:
                linear-gradient(120deg, rgba(255, 255, 255, 0.68) 0 28%, transparent 28% 100%),
                linear-gradient(135deg, #eff6ff 0%, #dbeafe 34%, #ccfbf1 68%, #fef3c7 100%);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(17, 24, 39, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(17, 24, 39, 0.045) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.82), transparent 78%);
        }

        .join-request {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.2;
            font-weight: 700;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
        }

        button {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 14px;
            color: #ffffff;
            background: linear-gradient(135deg, #2563eb 0%, #14b8a6 58%, #f59e0b 125%);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0;
            box-shadow: 0 16px 34px var(--button-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.34);
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.2s, filter 0.2s, transform 0.2s;
        }

        button::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
            transform: translateX(-120%);
            transition: transform 0.45s;
        }

        button:hover:not(:disabled) {
            box-shadow: 0 20px 42px rgba(20, 184, 166, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.38);
            filter: saturate(1.08);
            transform: translateY(-2px);
        }

        button:hover:not(:disabled)::before {
            transform: translateX(120%);
        }

        button:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.32);
            outline-offset: 4px;
        }

        button:disabled {
            background: var(--button-disabled);
            box-shadow: none;
            cursor: not-allowed;
        }

        .status-message {
            min-height: 22px;
            font-size: 15px;
            line-height: 1.45;
            color: #16a34a;
        }
    </style>
</head>
<body>
    <main class="join-request">
        <h1>Добро пожаловать</h1>
        <button id="loginButton" type="button">Войти</button>
        <div class="status-message" id="statusMessage" aria-live="polite"></div>
    </main>

    <script>
        const webApp = window.Telegram && window.Telegram.WebApp;
        const initData = webApp ? webApp.initData : "";
        const loginButton = document.getElementById("loginButton");
        const statusMessage = document.getElementById("statusMessage");
        var url = new URL(window.location.href);
        var answerJoinRequestUrl = url.protocol + '//' + url.hostname + ':' + url.port +'/' + url.pathname.split('/').at(1) + '/answer_join_request';        
        const queryId = new URLSearchParams(window.location.search).get("query_id") || "";

        if (webApp) {
            webApp.ready();
        }

        loginButton.addEventListener("click", async () => {
            loginButton.disabled = true;

            try {
                const response = await fetch(answerJoinRequestUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        "_auth": initData,
                        "query_id": queryId,
                    }),
                });

                if (response.status !== 200) {
                    throw new Error("Request failed");
                }

                startCloseCountdown();
            } catch (error) {
                console.error(error);
                loginButton.disabled = false;
            }
        });

        function startCloseCountdown() {
            let secondsLeft = 3;

            statusMessage.textContent = `Успешно! Страница закроется через ${secondsLeft} секунд`;

            const countdownTimer = window.setInterval(() => {
                secondsLeft -= 1;

                if (secondsLeft > 0) {
                    statusMessage.textContent = `Успешно! Страница закроется через ${secondsLeft} секунд`;
                    return;
                }

                window.clearInterval(countdownTimer);

                if (webApp) {
                    webApp.close();
                } else {
                    window.close();
                }
            }, 1000);
        }
    </script>
</body>
</html>
